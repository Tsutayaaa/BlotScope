[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blotscope"
version = "1.0.1"
description = "Local Western blot marker calibration and apparent molecular weight estimation"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10.0", "openpyxl>=3.1"]

[project.gui-scripts]
blotscope = "blotscope.gui:main"

[tool.setuptools.packages.find]
include = ["blotscope*", "wb_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
